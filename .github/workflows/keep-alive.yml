# Pings the Render app every 10 minutes so the free instance never goes to sleep.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables tab
#        -> New repository variable: APP_URL = https://<your-app>.onrender.com
# The app also pings itself while awake (app/keepalive.py). This job is the backup that
# wakes it after a deploy or restart. GitHub may run scheduled jobs a few minutes late.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL repository variable is not set, nothing to ping."
            exit 0
          fi
          # A sleeping free instance can take about a minute to wake, so allow retries and a long timeout.
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 \
               -A "swish-assist-keepalive" "${APP_URL%/}/health"
