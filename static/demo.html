<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swish Assist Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: var(--brand-ink); }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 16px; color: #d6eee3; font-size: 13px; }
    .bar strong { color: #fff; font-size: 14px; }
    .bar strong i { font-style: normal; color: var(--lime); }
    .bar a { color: #d6eee3; font-weight: 600; text-decoration: none; margin-left: 14px; }
    .split { flex: 1; display: grid; grid-template-columns: minmax(440px, 0.85fr) minmax(0, 1.15fr); gap: 2px; min-height: 0; }
    .split iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
    .label { position: absolute; }
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 100vh 100vh; }
      body { height: auto; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Swish Assist <i>·</i> customer on the left, support team on the right</strong>
    <span><a href="/chat" target="_blank">Open chat</a><a href="/dashboard" target="_blank">Open dashboard</a><a href="/">About</a></span>
  </div>
  <div class="split">
    <iframe src="/chat?embed=1" title="Customer chat"></iframe>
    <iframe src="/dashboard?embed=1" title="Support dashboard"></iframe>
  </div>
</body>
</html>
