<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swish Assist Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .appbar { padding: 10px 18px; }
    .hint { font: 12.5px var(--mono); color: var(--dim); }
    .hint b { color: var(--muted); font-weight: 500; }
    .split { flex: 1; display: grid; grid-template-columns: minmax(440px, 0.85fr) minmax(0, 1.15fr); min-height: 0; }
    .pane { position: relative; display: flex; flex-direction: column; min-height: 0; }
    .pane + .pane { border-left: 1px solid var(--line); }
    .pane .label { font: 500 11.5px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .04em; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
    .pane .label b { color: var(--info); font-weight: 500; }
    .split iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
    @media (max-width: 1100px) { .hint { display: none; } }
    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 100vh 100vh; }
      .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
      body { height: auto; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <a class="logo" href="/">Swish Assist <small>/ live demo</small></a>
    <span class="hint">Start with <b>Reset demo</b>, then try Priya → Sneha → Vikram</span>
    <nav class="keys" aria-label="Shortcuts">
      <a href="/chat" target="_blank" data-key="c"><span class="key">C</span>Chat</a>
      <a href="/dashboard" target="_blank" data-key="b"><span class="key">B</span>Dashboard</a>
      <a class="gh" href="https://github.com/MohammedZaid-AI/Swish-Assist#test-it-step-by-step-about-5-minutes" target="_blank" data-key="t"><span class="key">T</span>How to test</a>
      <a href="/" data-key="h"><span class="key">H</span>Home</a>
    </nav>
  </header>
  <div class="split">
    <div class="pane"><div class="label"><b>01</b> · customer · WhatsApp-style chat</div><iframe src="/chat?embed=1" title="Customer chat"></iframe></div>
    <div class="pane"><div class="label"><b>02</b> · support team · live dashboard</div><iframe src="/dashboard?embed=1" title="Support dashboard"></iframe></div>
  </div>
  <script src="/static/js/keys.js"></script>
  <script>
    fetch("/api/config").then((r) => r.json()).then((c) => {
      if (c.github_url) document.querySelector("a.gh").href = c.github_url.replace(/\/$/, "") + "#test-it-step-by-step-about-5-minutes";
    }).catch(() => {});
  </script>
</body>
</html>
